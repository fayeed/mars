[workspace]
members = ["apps/desktop/src-tauri", "crates/core"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
mars-core = { path = "crates/core" }
serde = { version = "1.0.228", features = ["derive"] }
tauri = { version = "2.11.5", default-features = false, features = ["wry"] }
tauri-build = "2.6.3"
