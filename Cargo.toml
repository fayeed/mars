[workspace]
members = ["apps/desktop/src-tauri", "crates/core", "crates/security", "crates/storage"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
mars-core = { path = "crates/core" }
mars-security = { path = "crates/security" }
mars-storage = { path = "crates/storage" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
rusqlite = { version = "0.40.1", features = ["bundled"] }
sha2 = "0.10.9"
thiserror = "2.0.18"
time = { version = "0.3.53", features = ["formatting"] }
tokio-util = "0.7.18"
uuid = { version = "1.23.4", features = ["v7"] }
tauri = { version = "2.11.5", default-features = false, features = ["wry"] }
tauri-build = "2.6.3"
